env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

name: Android CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Install Dependencies
      run: npm install
      working-directory: telon-gateway-app

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: telon-gateway-app/android

    - name: Build APK with Gradle
      # 'assembleDebug' creates a test APK; use 'assembleRelease' for a final version
      run: ./gradlew assembleDebug
      working-directory: telon-gateway-app/android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk
